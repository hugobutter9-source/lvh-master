# Publishes the app (the src/ folder, no build step) to GitHub Pages.
# It only works once Pages is switched on for the repository:
# Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish to GitHub Pages

on:
  push:
    branches: [claude/eager-volta-uey5qk, main]
    paths: ['src/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
